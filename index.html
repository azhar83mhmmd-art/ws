<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tajud Dipenjaruy (WS) — Official Historical Archive</title>
<meta name="description" content="Official Historical Archive squad Mobile Legends Tajud Dipenjaruy (WS). The First Record Is Written. The History Continues.">
<meta name="theme-color" content="#0a090c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   TAJUD DIPENJARUY — OFFICIAL HISTORICAL ARCHIVE
   Tema warna mengikuti proyek ml-squad-biography:
   deep black + charcoal, crimson (aksen utama), gold (detail arsip).
   ========================================================= */
:root{
  --bg:#0a090c; --bg-soft:#100e12; --surface:#16131a; --surface-2:#1c1820;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --text:#f4efe9; --dim:#a89fae; --faint:#857d8c;
  --accent:#d81e3f; --accent-2:#ff6b85; --accent-soft:rgba(216,30,63,.16); --accent-glow:rgba(216,30,63,.35);
  --gold:#c9a15a; --gold-soft:rgba(201,161,90,.16);
  --f-display:'Anton','Bebas Neue','Oswald','Roboto Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Roboto Mono',monospace;
  --maxw:1240px; --top-h:60px; --bot-h:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 900px 520px at 12% -8%,rgba(216,30,63,.11),transparent 60%),radial-gradient(ellipse 700px 420px at 100% 0,rgba(201,161,90,.06),transparent 55%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
::selection{background:var(--accent-soft);color:var(--text)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:3px;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.dim{color:var(--dim)}
.ic{flex:none;display:block}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,9,12,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topbar-in{max-width:var(--maxw);margin:0 auto;height:var(--top-h);padding:0 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:400 1.15rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;min-height:44px}
.brand small{font:500 .62rem/1 var(--f-mono);letter-spacing:.16em;color:var(--dim);padding-left:10px;border-left:1px solid var(--line-2)}
.top-links{display:none;margin-left:auto;gap:2px}
.top-links a{position:relative;display:flex;align-items:center;min-height:44px;padding:0 14px;font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);transition:color .2s}
.top-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.top-links a:hover,.top-links a[aria-current="true"]{color:var(--text)}
.top-links a[aria-current="true"]::after{transform:scaleX(1)}
.s-btn{margin-left:auto;display:flex;align-items:center;gap:10px;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--line-2);border-radius:3px;background:transparent;color:var(--dim);font-size:.8rem;transition:border-color .2s,color .2s,background .2s}
.s-btn:hover{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.s-btn span{display:none}
.s-btn kbd{font:500 .68rem var(--f-mono);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;color:var(--faint)}
@media(min-width:960px){
  .top-links{display:flex}
  .s-btn{margin-left:0}
  .s-btn span{display:inline}
}
@media(max-width:420px){.brand small{display:none}}

/* ---------- bottom nav ---------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--bot-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10,9,12,.97);border-top:1px solid var(--line-2);display:grid;grid-template-columns:repeat(7,1fr)}
.bottom-nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px;color:var(--faint);font:600 .6rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.bottom-nav a::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.bottom-nav a[aria-current="true"]{color:var(--text)}
.bottom-nav a[aria-current="true"]::before{transform:scaleX(1)}
.bottom-nav a[aria-current="true"] .ic{color:var(--accent-2)}
@media(min-width:960px){.bottom-nav{display:none}body{padding-bottom:0}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;min-height:calc(100svh - var(--top-h));display:flex;align-items:center;padding:36px 0 56px}
.hero-bg{position:absolute;inset:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 30% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 30% 40%,#000 30%,transparent 80%)}
.grid-drift{position:absolute;inset:-48px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.55;animation:drift 60s linear infinite}
.hero::after{content:"";position:absolute;left:-10%;top:-20%;width:70%;height:80%;background:radial-gradient(closest-side,rgba(216,30,63,.16),transparent);pointer-events:none}
.hero-year{position:absolute;right:-3%;top:2%;font:400 clamp(9rem,42vw,30rem)/.8 var(--f-display);color:transparent;-webkit-text-stroke:1px rgba(216,30,63,.42);letter-spacing:.02em;user-select:none;pointer-events:none;opacity:.9}
.hero-inner{position:relative;z-index:1;width:100%;min-width:0}
.hero-grid>*{min-width:0}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;color:var(--dim);padding-bottom:14px;border-bottom:1px solid var(--line)}
.hero-meta b{color:var(--gold);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:8px;min-height:26px;padding:0 10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--text);border-radius:2px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);animation:pulse 2.4s ease-in-out infinite}
.badge.ghost{border-color:var(--line-2);background:transparent;color:var(--dim)}
.hero-grid{display:grid;gap:36px;margin-top:clamp(28px,6vw,64px)}
.tag-row{display:flex;align-items:center;gap:14px;color:var(--dim)}
.tagbox{display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:42px;padding:0 14px;border:1px solid var(--accent);background:var(--accent-soft);font:400 1.55rem/1 var(--f-display);letter-spacing:.14em}
.hero-title{margin-top:20px;font-family:var(--f-display);font-weight:400;line-height:.9;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:break-word;font-size:clamp(2.8rem,12.4vw,8.6rem)}
.hero-grid>div:first-child{container-type:inline-size}
@supports(font-size:1cqw){.hero-title{font-size:clamp(2.8rem,min(14.5cqw,12.4vw),9.5rem)}}
.hero-title span{display:block}
.hero-sub{margin-top:26px;display:flex;align-items:center;gap:14px;color:var(--text);letter-spacing:.24em;font-size:.8rem}
.hero-sub::before{content:"";width:44px;height:1px;background:var(--accent)}
.hero-founded{margin-top:10px;color:var(--gold)}
.hero-text .lead{font-size:clamp(1.15rem,3.2vw,1.45rem);line-height:1.45;color:var(--text);font-weight:500;max-width:34ch;padding-left:18px;border-left:2px solid var(--accent)}
.hero-text .body{margin-top:20px;color:var(--dim);max-width:52ch}
.hero-line{position:relative;margin-top:clamp(36px,6vw,56px)}
.hl-top{display:flex;align-items:center;gap:14px}
.hl-mark{width:12px;height:12px;flex:none;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 0 4px var(--accent-soft),0 0 18px var(--accent-glow)}
.hl-rule{position:relative;flex:1;height:1px;overflow:hidden;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.28) 30%,transparent);transform-origin:left;animation:draw 1.8s .6s both cubic-bezier(.2,.7,.2,1)}
.hl-rule::after{content:"";position:absolute;top:0;left:0;width:90px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:glint 7s 2.6s linear infinite}
.hl-ticks{height:7px;margin:5px 0 0 26px;background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 22px);-webkit-mask-image:linear-gradient(90deg,#000,transparent 85%);mask-image:linear-gradient(90deg,#000,transparent 85%)}
.hl-label{margin:14px 0 0 26px;color:var(--dim)}
.hero-tagline{margin-top:28px;font:400 clamp(1.5rem,5vw,2.6rem)/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.hero-tagline span{display:block}
.hero-tagline span+span{color:var(--dim)}
.reg{position:absolute;width:18px;height:18px;z-index:1;pointer-events:none;opacity:.55;background:linear-gradient(var(--line-2),var(--line-2)) center/1px 100% no-repeat,linear-gradient(var(--line-2),var(--line-2)) center/100% 1px no-repeat}
.reg.a{left:10px;top:12px}.reg.b{right:10px;bottom:16px}
[data-in]{animation:rise .8s var(--d,0s) both cubic-bezier(.2,.7,.2,1)}
@media(min-width:960px){
  .hero-grid{grid-template-columns:1.3fr 1fr;align-items:end;gap:72px}
}

/* ---------- section scaffolding ---------- */
.sec{position:relative;padding:clamp(56px,9vw,116px) 0;border-top:1px solid var(--line);scroll-margin-top:var(--top-h)}
.sec-head .sec-no{display:flex;align-items:center;gap:12px;color:var(--gold)}
.sec-head .sec-no::after{content:"";width:48px;height:1px;background:var(--accent)}
.sec-head h2{margin:16px 0 12px;font:400 clamp(2.3rem,6.5vw,3.8rem)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.sec-head>p:last-child{color:var(--dim);max-width:36ch}
.sec-head.wide>p:last-child{max-width:62ch}
.split{display:grid;gap:36px}
@media(min-width:960px){
  .split{grid-template-columns:290px 1fr;gap:72px}
  .split>.sec-head{position:sticky;top:calc(var(--top-h) + 32px);align-self:start}
}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.flash{outline:2px solid var(--accent);outline-offset:6px;animation:flash 1.6s ease-out 1}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- overview ---------- */
.ov{display:grid;gap:40px;margin-top:40px}
@media(min-width:900px){.ov{grid-template-columns:1.55fr 1fr;gap:64px;align-items:start}}
.sheet{border-top:1px solid var(--line-2)}
.sheet .row{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.sheet dt{color:var(--dim);padding-top:3px}
.sheet dd{font-size:1.05rem;font-weight:500}
@media(min-width:600px){.sheet .row{grid-template-columns:190px 1fr}}
.idcard{position:relative;overflow:hidden;padding:24px;border:1px solid var(--line-2);border-radius:4px;background:linear-gradient(160deg,var(--surface),var(--bg-soft))}
.idcard::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.02) 10px 11px)}
.idc-top{position:relative;display:flex;justify-content:space-between;color:var(--dim);padding-bottom:12px;border-bottom:1px dashed var(--line-2)}
.idc-id{position:relative;margin:18px 0 14px;font:400 clamp(2rem,6vw,2.6rem)/1 var(--f-display);letter-spacing:.06em}
.barcode{position:relative;display:block;width:100%;height:30px;color:var(--text);opacity:.8}
.idc-meta{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.idc-meta dt{color:var(--faint)}
.idc-meta dd{margin-top:4px;font:500 1.05rem var(--f-mono);letter-spacing:.06em}
.stamp{position:absolute;right:-14px;bottom:-18px;width:132px;height:132px;color:var(--accent-2);opacity:.85;transform:rotate(-14deg);pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:56px;border-top:1px solid var(--line-2)}
.stat{padding:22px 16px 6px 0}
.stat+.stat{padding-left:20px;border-left:1px solid var(--line)}
.stat .num{display:block;font:400 clamp(3rem,8vw,4.8rem)/1 var(--f-display);letter-spacing:.01em}
.stat .lbl{display:block;margin-top:8px;color:var(--dim)}
.stats-note{margin-top:18px;color:var(--faint)}
@media(max-width:559px){.stat:nth-child(odd){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---------- history timeline ---------- */
.tl{position:relative}
.tl::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:1px;background:linear-gradient(var(--accent),var(--line-2) 35%,var(--line-2))}
.ev{position:relative;padding:0 0 46px 62px;scroll-margin-top:calc(var(--top-h) + 20px)}
.ev:last-child{padding-bottom:0}
.ev-marker{position:absolute;left:3px;top:3px;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--accent);background:var(--bg);transform:rotate(45deg);box-shadow:0 0 0 4px var(--bg)}
.ev-marker span{transform:rotate(-45deg);font:600 .72rem var(--f-mono);color:var(--accent-2)}
.ev-top{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--gold);padding-top:8px}
.ev-type{color:var(--dim)}
.ev h3{margin:10px 0 8px;font:400 clamp(1.6rem,4.5vw,2.2rem)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.015em}
.ev-desc{color:var(--dim);max-width:60ch}
.ev-code{margin-top:14px;color:var(--faint)}

/* ---------- eras ---------- */
.era{position:relative;overflow:hidden;display:grid;gap:26px;padding:clamp(24px,5vw,48px);border:1px solid var(--line-2);background:linear-gradient(120deg,var(--surface),var(--bg-soft) 70%);scroll-margin-top:calc(var(--top-h) + 20px)}
.era+.era{margin-top:24px}
.era-numeral{position:absolute;right:2%;top:-8%;font:400 clamp(11rem,34vw,26rem)/1 var(--f-display);color:transparent;-webkit-text-stroke:1px rgba(216,30,63,.35);pointer-events:none;user-select:none}
.era-main{position:relative}
.era-chapter{color:var(--gold)}
.era h3{margin:14px 0 6px;font:400 clamp(2.2rem,7vw,4rem)/.95 var(--f-display);text-transform:uppercase}
.era h3 small{display:block;margin-top:8px;font:400 clamp(1.2rem,3.4vw,1.8rem)/1.1 var(--f-display);color:var(--dim);letter-spacing:.04em}
.era-date{color:var(--dim)}
.era-cols{position:relative;display:grid;gap:30px;margin-top:8px}
@media(min-width:760px){.era-cols{grid-template-columns:1.2fr 1fr;gap:56px;max-width:860px}}
.era h4{font:600 .7rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.leaders li{display:flex;align-items:baseline;gap:10px;padding:11px 0}
.leaders li span:first-child{white-space:nowrap}
.leaders li::after{content:"";order:1;flex:1;border-bottom:1px dotted var(--line-2);transform:translateY(-4px)}
.leaders li span:last-child{order:2;color:var(--dim);text-align:right}
.era-end{margin-top:26px;color:var(--faint);display:flex;align-items:center;gap:14px}
.era-end::before{content:"";width:32px;height:1px;background:var(--line-2)}

/* ---------- roster cards ---------- */
.cards{display:grid;gap:14px;margin-top:44px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.pcard{position:relative;display:flex;flex-direction:column;padding:20px;border:1px solid var(--line);border-radius:4px;background:var(--surface);transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-4px);border-color:rgba(216,30,63,.55);box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
.pcard.lead{border-color:rgba(216,30,63,.6);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 55%)}
.pc-top{display:flex;justify-content:space-between;gap:8px;color:var(--faint)}
.av{width:88px;height:88px;margin:18px 0 14px}
.av path{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.pcard.lead .av path{stroke:var(--accent);fill:rgba(216,30,63,.12)}
.av .ini{font:400 40px var(--f-display);fill:var(--text)}
.av .code{font:500 8.5px var(--f-mono);letter-spacing:.14em;fill:var(--dim)}
.pcard h3{font:400 1.8rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.pc-role{margin-top:6px;color:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:26px}
.tagchip{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;color:var(--text)}
.pc-dl{margin-top:16px;padding-top:6px;border-top:1px solid var(--line)}
.pc-dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.pc-dl dt{color:var(--faint);font:500 .66rem/1.7 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.pc-dl dd{text-align:right}
.pc-open{margin-top:auto;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding-top:12px;background:none;border:0;border-top:0;color:var(--dim);font:600 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-align:left}
.pc-open:hover{color:var(--accent-2)}

/* ---------- role map ---------- */
.rm-grid{display:grid;gap:28px}
@media(min-width:1180px){.rm-grid{grid-template-columns:1.15fr 1fr;align-items:start}}
.era-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.rmap{position:relative;width:100%;max-width:560px;aspect-ratio:1/1.08;border:1px solid var(--line-2);background:var(--bg-soft);margin:0 auto;overflow:hidden}
.rmap-svg{position:absolute;inset:0;width:100%;height:100%}
.rmap-svg .frame{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.rmap-svg .kite{fill:rgba(216,30,63,.05);stroke:rgba(216,30,63,.55);stroke-width:1;vector-effect:non-scaling-stroke}
.rmap-svg .axis{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:84px;padding:6px}
.n-dot{width:14px;height:14px;background:var(--bg);border:2px solid var(--accent);transform:rotate(45deg);box-shadow:0 0 0 4px var(--accent-soft)}
.node.empty .n-dot{border-color:var(--faint);box-shadow:none}
.n-role{margin-top:6px;color:var(--gold);font-size:.62rem}
.n-name{font:400 clamp(1rem,3.6vw,1.35rem)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.node.empty .n-name{font:400 .68rem/1.3 var(--f-body);color:var(--faint);text-transform:none;max-width:90px}
.rtable{width:100%;border-collapse:collapse}
.rtable th,.rtable td{padding:14px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
.rtable thead th{color:var(--faint);border-bottom-color:var(--line-2)}
.rtable tbody th{font-weight:400;color:var(--gold);width:44%}
.rtable td{font-size:1.05rem;font-weight:500}

/* ---------- leadership ---------- */
.band{background:linear-gradient(180deg,var(--bg-soft),var(--bg));}
.lead-grid{display:grid;gap:0;margin-top:44px;border-top:1px solid var(--line-2)}
@media(min-width:760px){.lead-grid{grid-template-columns:repeat(2,1fr)}.lead-col+.lead-col{border-left:1px solid var(--line-2);padding-left:48px}.lead-col{padding-right:48px}}
.lead-col{padding:28px 0;border-bottom:1px solid var(--line)}
.lead-col .role{color:var(--gold)}
.lead-ent{margin-top:14px}
.lead-ent+.lead-ent{padding-top:16px;border-top:1px dashed var(--line-2)}
.lead-name{font:400 clamp(3rem,10vw,5.6rem)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.lead-meta{margin-top:8px;color:var(--dim)}
.lead-note{margin-top:40px;max-width:66ch;font-size:clamp(1.1rem,2.8vw,1.35rem);line-height:1.5;padding-left:20px;border-left:2px solid var(--accent)}

/* ---------- player database ---------- */
.db{margin-top:44px;display:grid;border:1px solid var(--line-2);background:var(--surface)}
@media(min-width:900px){.db{grid-template-columns:minmax(320px,390px) 1fr}}
.db-list{border-bottom:1px solid var(--line-2)}
@media(min-width:900px){.db-list{border-bottom:0;border-right:1px solid var(--line-2)}}
.db-h{display:grid;grid-template-columns:78px 1fr auto;gap:12px;padding:12px 16px;color:var(--faint);border-bottom:1px solid var(--line-2);background:var(--bg-soft)}
.db-row{width:100%;display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;min-height:58px;padding:8px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;transition:background .2s}
.db-row:hover{background:var(--surface-2)}
.db-row[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.c-id{font:500 .68rem var(--f-mono);letter-spacing:.06em;color:var(--dim)}
.c-name{font:400 1.2rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.c-role{font-size:.8rem;color:var(--dim)}
.db-detail{padding:clamp(22px,4vw,40px);min-width:0;animation:rise .45s both cubic-bezier(.2,.7,.2,1)}
.dd-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--gold);padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.dd-name{margin:22px 0 12px;font:400 clamp(2.6rem,8vw,4.6rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.dd-dl{display:grid;margin-top:26px;border-top:1px solid var(--line-2)}
@media(min-width:640px){.dd-dl{grid-template-columns:1fr 1fr;column-gap:36px}}
.dd-dl div{padding:14px 0;border-bottom:1px solid var(--line)}
.dd-dl dt{color:var(--faint)}
.dd-dl dd{margin-top:5px;font-weight:500}
.dd-dl dd.na{color:var(--faint);font-weight:400;font-style:italic}
.dd-refs{margin-top:26px}
.dd-refs h4{color:var(--gold);margin-bottom:8px}
.ref{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text)}
.ref:hover{color:var(--accent-2)}
.ref .mono{color:var(--dim);min-width:92px}

/* ---------- visual timeline tree ---------- */
.tree{margin-bottom:32px}
.tree ul{position:relative;margin:0;padding-left:28px}
.tree li{position:relative;padding:7px 0 7px 26px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line-2)}
.tree li:last-child::before{bottom:auto;height:25px}
.tree li::after{content:"";position:absolute;left:0;top:25px;width:18px;border-top:1px solid var(--line-2)}
.tree ul ul{padding-left:22px}
.t-node{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:2px;transition:border-color .2s,background .2s}
button.t-node:hover{border-color:var(--accent);background:var(--accent-soft)}
.t-node.root{border-color:var(--accent);background:var(--accent-soft);min-height:40px}
.t-node.leaf{font:500 .85rem var(--f-body);letter-spacing:0;text-transform:none;color:var(--dim)}
.tree .t-node.mono{font-size:.7rem}

/* ---------- archive status ---------- */
.stl{display:grid;gap:0;margin-top:40px;border-top:1px solid var(--line-2)}
@media(min-width:900px){.stl{display:block;column-count:2;column-gap:64px}.st{break-inside:avoid}}
.st{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 0;border-bottom:1px solid var(--line)}
.st-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%}
.st.rec .st-ic{background:var(--accent);color:#fff}
.st.nrec .st-ic{border:1px dashed var(--faint);color:var(--faint)}
.st-l{flex:1;min-width:0}
.st-l .k{display:block;font:600 .8rem var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.st.nrec .st-l .k{color:var(--dim)}
.st-l .n{display:block;margin-top:2px;font-size:.78rem;color:var(--faint)}
.st-v{font:600 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;text-align:right}
.st.rec .st-v{color:var(--accent-2)}
.st.nrec .st-v{color:var(--faint)}
.st-note{display:flex;gap:14px;margin-top:32px;padding:18px 20px;border:1px solid var(--gold-soft);border-left:2px solid var(--gold);background:var(--gold-soft);max-width:720px;color:var(--text);font-size:.92rem}
.st-count{margin-top:18px;color:var(--dim)}
.maint{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:56px;padding-top:22px;border-top:1px dashed var(--line-2);color:var(--faint);font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 18px;border:1px solid var(--line-2);border-radius:3px;background:transparent;color:var(--text);font:600 .76rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#e6274b}
.btn.danger:hover{border-color:#ff6b85;background:rgba(255,107,133,.1)}
.btn.sm{min-height:44px;padding:0 14px}
.btn.on{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- join / recruitment ---------- */
.join-view{margin-top:40px;max-width:640px}
.jf-lead{margin-top:22px;font-size:clamp(1.02rem,2.6vw,1.22rem);line-height:1.55;color:var(--text);max-width:56ch;padding-left:18px;border-left:2px solid var(--accent)}
.qr-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:320px;margin:40px auto 0;padding:26px 22px;border:1px solid var(--line-2);border-radius:6px;background:linear-gradient(160deg,var(--surface),var(--bg-soft))}
.qr-card[data-in]{animation:rise .7s .1s both cubic-bezier(.2,.7,.2,1)}
.qr-svg{width:100%;max-width:220px;height:auto;border-radius:4px}
.qr-scan{font:600 .78rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.join-fallback{display:flex;justify-content:center;margin-top:32px}
.step-ind{display:inline-flex;align-items:center;gap:10px}
.step-ind::before{content:"";width:26px;height:1px;background:var(--accent)}
.jf-h4{margin:30px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line-2);font:600 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.jf-h4:first-child{margin-top:0}
.fld .err{display:block;min-height:1.05em;margin-top:6px;color:var(--accent-2);font-size:.78rem}
.fld [aria-invalid="true"]{border-color:var(--accent-2)}
.jf-check{display:flex;align-items:flex-start;gap:12px;margin:28px 0 6px;padding:16px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface)}
.jf-check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.jf-check label{font-size:.9rem}
.btn.loading{position:relative;color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-wrap{margin:28px auto 0;max-width:320px;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--bg-soft);animation:rise .5s both cubic-bezier(.2,.7,.2,1)}
.rc-wrap canvas{display:block;width:100%;height:auto}
.rc-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.next-step{margin-top:52px;padding-top:30px;border-top:1px solid var(--line-2)}
.wa-actions{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:18px}
.btn.block{width:100%;max-width:400px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.btn.loading::after{animation:none}}

/* ---------- footer ---------- */
.footer{padding:56px 0 40px;border-top:1px solid var(--line-2);background:var(--bg-soft)}
.f-grid{display:grid;gap:30px}
@media(min-width:800px){.f-grid{grid-template-columns:1.4fr 1fr;align-items:end}}
.f-name{font:400 clamp(2.4rem,7vw,4.2rem)/.95 var(--f-display);text-transform:uppercase}
.f-tag{display:inline-block;margin-top:10px;padding:4px 12px;border:1px solid var(--accent);background:var(--accent-soft);font:400 1.2rem var(--f-display);letter-spacing:.14em}
.f-meta p{padding:9px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.f-meta p b{color:var(--text);font-weight:500}
.f-disc{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:.82rem;max-width:70ch}

/* ---------- dialogs ---------- */
dialog{padding:0;max-width:none;border:1px solid var(--line-2);background:var(--bg-soft);color:var(--text);border-radius:4px;box-shadow:0 40px 80px -20px rgba(0,0,0,.9)}
dialog::backdrop{background:rgba(5,4,6,.82)}
dialog[open]{display:flex;flex-direction:column}
#searchDlg{width:min(720px,calc(100% - 24px));height:min(680px,calc(100dvh - 16vh));margin:8vh auto auto}
#editorDlg{width:min(760px,calc(100% - 24px));height:min(760px,calc(100dvh - 8vh));margin:auto}
@media(max-width:700px){
  #searchDlg,#editorDlg{width:100%;height:100dvh;max-height:none;margin:0;border:0;border-radius:0}
}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font:400 1.4rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-2);background:transparent;border-radius:3px;color:var(--text)}
.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.s-input{position:relative;margin:16px 20px 0;color:var(--dim)}
.s-input .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.s-input input{width:100%;height:52px;padding:0 14px 0 44px;background:var(--surface);border:1px solid var(--line-2);border-radius:3px;color:var(--text);font:500 16px var(--f-body)}
.s-input input:focus{border-color:var(--gold);outline:none}
.s-input input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--dim);font:600 .74rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.chip:hover{color:var(--text);border-color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.s-count{padding:10px 20px 6px;color:var(--faint)}
.s-res{flex:1;overflow-y:auto;padding:0 12px 16px;overscroll-behavior:contain}
.s-res li{animation:rise .3s calc(var(--i,0) * 22ms) both ease-out}
.res{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 10px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text);transition:background .15s}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res-kind{flex:none;width:86px;padding:3px 0;text-align:center;border:1px solid var(--line-2);border-radius:2px;color:var(--gold);font-size:.6rem}
.res-main{flex:1;min-width:0}
.res-title{display:block;font-weight:600}
.res-sub{display:block;margin-top:1px;font-size:.82rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:var(--accent-soft);color:var(--text);border-bottom:1px solid var(--accent-2);padding:0 1px}
.s-empty{padding:26px 10px;color:var(--dim)}
.s-sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.e-note{padding:12px 20px 0;color:var(--dim);font-size:.85rem}
.e-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 6px;scrollbar-width:none}
.e-tabs::-webkit-scrollbar{display:none}
.e-body{flex:1;overflow-y:auto;padding:14px 20px 24px;overscroll-behavior:contain}
.e-msg{min-height:44px;padding:10px 20px;border-top:1px solid var(--line);color:var(--gold);font-size:.85rem}
.fld{margin-bottom:16px}
.fld label{display:block;margin-bottom:6px;font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;padding:10px 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:3px;color:var(--text);font:400 16px var(--f-body);color-scheme:dark}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);outline:none}
.fld small{display:block;margin-top:5px;color:var(--faint);font-size:.78rem}
.frow{display:grid;gap:0 16px}
@media(min-width:560px){.frow{grid-template-columns:1fr 1fr}}
.e-actions{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 22px}
.e-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.e-list li span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.e-h{margin:22px 0 8px;font:600 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sel-row{display:grid;grid-template-columns:1fr minmax(150px,200px);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sel-row label{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sel-row select{min-height:44px;padding:0 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:3px;color:var(--text);font:400 15px var(--f-body);color-scheme:dark}

.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:960px){.toast{bottom:28px}}

/* ---------- keyframes ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glint{from{transform:translateX(-100px)}to{transform:translateX(120vw)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent-glow)}30%{box-shadow:0 0 0 10px var(--accent-glow)}100%{box-shadow:0 0 0 0 transparent}}

@media(prefers-reduced-motion:reduce){

  .hl-rule::after,.grid-drift{animation:none!important}
  .reveal{opacity:1;transform:none}
}

const KEY = 'ws-archive:v1';
const emptyAdd = () => ({ players: [], events: [], eras: [], leadership: [], status: {} });
const S = (v, max) => typeof v === 'string' ? v.replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max || 300) : '';
const cleanId = (v) => S(v, 40).replace(/[^\w-]/g, '');

function sanitizeAdd(o){
  const out = emptyAdd();
  if (!o || typeof o !== 'object') return out;
  const arr = (x) => Array.isArray(x) ? x.slice(0, 200) : [];
  arr(o.players).forEach((p) => {
    if (!p || typeof p !== 'object') return;
    const name = S(p.name, 40), role = S(p.role, 40);
    if (!name || !role) return;
    out.players.push({ id: cleanId(p.id) || uid(), name, role, joined: S(p.joined, 40) || NA, classification: S(p.classification, 80) || 'Roster',
      eras: Array.isArray(p.eras) ? p.eras.map(cleanId).filter(Boolean).slice(0, 10) : [] });
  });
  arr(o.events).forEach((e) => {
    if (!e || typeof e !== 'object' || !isoOk(e.iso)) return;
    const type = S(e.type, 40), title = S(e.title, 80), description = S(e.description, 500);
    if (!type || !title) return;
    out.events.push({ id: cleanId(e.id) || uid(), iso: e.iso, type, title, description: description || NA, era: cleanId(e.era) });
  });
  arr(o.eras).forEach((e) => {
    if (!e || typeof e !== 'object' || !isoOk(e.iso)) return;
    const title = S(e.title, 60); if (!title) return;
    out.eras.push({ uid: cleanId(e.uid) || uid(), title, iso: e.iso, note: S(e.note, 300) });
  });
  arr(o.leadership).forEach((l) => {
    if (!l || typeof l !== 'object') return;
    const title = S(l.title, 40), name = S(l.name, 40); if (!title || !name) return;
    out.leadership.push({ id: cleanId(l.id) || uid(), title, name, from: S(l.from, 40) || NA, era: cleanId(l.era), note: S(l.note, 300) });
  });
  if (o.status && typeof o.status === 'object') {
    squadData.status.forEach((s) => { const v = o.status[s.key]; if (v === 'recorded' || v === 'not-recorded') out.status[s.key] = v; });
  }
  return out;
}

function build(){
  const d = JSON.parse(JSON.stringify(squadData));
  const a = add;
  const B = { squad: { name: d.name, tag: d.tag, founded: d.founded, foundedISO: d.foundedISO, founder: d.founder, captain: d.captain, archive: d.archive, note: d.leadershipNote } };

  B.eras = d.eras.map((e) => Object.assign({}, e, { custom: false }))
    .concat(a.eras.map((e) => ({ uid: e.uid, title: e.title, iso: e.iso, date: fmtDate(e.iso), note: e.note, custom: true })));
  B.eras.forEach((e, i) => { e.id = toRoman(i + 1); });
  const uids = new Set(B.eras.map((e) => e.uid));
  const lastUid = B.eras[B.eras.length - 1].uid;
  const fixEra = (u) => uids.has(u) ? u : lastUid;

  B.players = d.roster.map((p, i) => Object.assign({}, p, { key: 'd' + i, custom: false }))
    .concat(a.players.map((p) => ({ key: p.id, name: p.name, role: p.role, joined: p.joined, classification: p.classification, status: 'Recorded', eras: p.eras, custom: true })));
  B.players.forEach((p, i) => {
    p.pid = 'WS-P-' + pad(i + 1, 3);
    p.eras = (p.eras || []).filter((u) => uids.has(u));
    if (!p.eras.length) p.eras = [lastUid];
  });

  B.leadership = d.leadership.map((l, i) => Object.assign({}, l, { key: 'dl' + i, custom: false }))
    .concat(a.leadership.map((l) => ({ key: l.id, title: l.title, name: l.name, from: l.from, era: l.era, note: l.note, custom: true })));
  B.leadership.forEach((l) => { l.era = fixEra(l.era); });

  const ev = d.timeline.map((e, i) => Object.assign({}, e, { custom: false, seq: i }))
    .concat(a.events.map((e, i) => ({ id: e.id, iso: e.iso, date: fmtDate(e.iso), type: e.type, title: e.title, description: e.description,
      era: e.era, treeLabel: e.type.toUpperCase(), custom: true, seq: 1000 + i })));
  ev.sort((x, y) => x.iso === y.iso ? x.seq - y.seq : (x.iso < y.iso ? -1 : 1));
  ev.forEach((e, i) => { e.no = pad(i + 1); e.code = 'EVT-' + pad(i + 1, 3); e.era = fixEra(e.era); });
  B.timeline = ev;

  B.status = d.status.map((s) => Object.assign({}, s, { state: a.status[s.key] || s.state }));

  B.originals = B.players.filter((p) => /original roster/i.test(p.classification));
  return B;
}

function barcode(str){

  });
  return '<svg class="barcode" viewBox="0 0 ' + x + ' 30" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">' + out + '</svg>';
}

function qrSVG(text, size){
  try {
    const qr = qrcode(0, 'M');
    qr.addData(text); qr.make();
    const n = qr.getModuleCount(), margin = 4, total = n + margin * 2, cell = size / total;
    let rects = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c))
      rects += '<rect x="' + ((c + margin) * cell).toFixed(2) + '" y="' + ((r + margin) * cell).toFixed(2) + '" width="' + (cell + .5).toFixed(2) + '" height="' + (cell + .5).toFixed(2) + '"/>';
    return '<svg class="qr-svg" viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code pendaftaran ' + esc(A.squad.name) + '">' +
      '<rect width="' + size + '" height="' + size + '" fill="#f4efe9" rx="6"/><g fill="#0a090c">' + rects + '</g></svg>';
  } catch (e) { return '<p class="dim">QR code tidak dapat dibuat pada perangkat ini.</p>'; }
}

function drawRecruitCard(app, cb){
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Digital recruitment card untuk ' + app.nickname);
  const ctx = cv.getContext('2d');
  const draw = () => {
    const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#16131a'); bg.addColorStop(1, '#0a090c');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 3; ctx.strokeRect(28, 28, W - 56, H - 56);
    ctx.strokeStyle = 'rgba(216,30,63,.7)'; ctx.lineWidth = 1; ctx.strokeRect(42, 42, W - 84, H - 84);
    ctx.textAlign = 'left'; ctx.fillStyle = '#857d8c'; ctx.font = '600 22px Inter, sans-serif';
    ctx.fillText('OFFICIAL RECRUITMENT', 80, 130);
    ctx.textAlign = 'right'; ctx.fillText('WS ARCHIVE · 2026', W - 80, 130); ctx.textAlign = 'left';
    ctx.fillStyle = '#f4efe9'; ctx.font = '400 74px Anton, Impact, sans-serif';
    ctx.fillText('TAJUD DIPENJARUY', 80, 220);
    ctx.strokeStyle = '#d81e3f'; ctx.fillStyle = 'rgba(216,30,63,.16)'; ctx.fillRect(80, 244, 90, 52); ctx.lineWidth = 2; ctx.strokeRect(80, 244, 90, 52);
    ctx.fillStyle = '#f4efe9'; ctx.font = '400 34px Anton, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('WS', 125, 282); ctx.textAlign = 'left';
    ctx.fillStyle = '#c9a15a'; ctx.font = '600 26px Inter, sans-serif'; ctx.fillText('RECRUITMENT 2026', 190, 278);
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(80, 340); ctx.lineTo(W - 80, 340); ctx.stroke();
    const field = (label, value, y) => {
      ctx.fillStyle = '#857d8c'; ctx.font = '600 22px Inter, sans-serif'; ctx.fillText(label, 80, y);
      ctx.fillStyle = '#f4efe9'; ctx.font = '400 46px Anton, Impact, sans-serif'; ctx.fillText(String(value).toUpperCase(), 80, y + 56);
    };
    field('APPLICANT', app.nickname, 420);
    field('ROLE', app.primaryRole, 560);
    ctx.fillStyle = '#857d8c'; ctx.font = '600 20px Inter, sans-serif'; ctx.fillText('APPLICATION ID', 80, 700);
    ctx.fillStyle = '#ff6b85'; ctx.font = '500 40px ui-monospace, Menlo, monospace'; ctx.fillText(app.applicationId, 80, 748);
    ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 2; ctx.strokeRect(80, 790, 260, 62);
    ctx.fillStyle = '#c9a15a'; ctx.font = '600 26px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('UNDER REVIEW', 210, 830); ctx.textAlign = 'left';
    ctx.fillStyle = '#857d8c'; ctx.font = '500 24px ui-monospace, Menlo, monospace'; ctx.fillText('APPLIED ' + fmtDot(app.submittedAt), 80, 910);
    let seed = 0; for (let i = 0; i < app.applicationId.length; i++) seed = (seed * 31 + app.applicationId.charCodeAt(i)) >>> 0;
    const rnd = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 8) / 0x1000000; };
    let bx = 80; ctx.fillStyle = 'rgba(244,239,233,.8)';
    while (bx < W - 80) { const bw = 2 + Math.floor(rnd() * 6); ctx.fillRect(bx, 970, bw, 60); bx += bw + 2 + Math.floor(rnd() * 6); }
    ctx.save(); ctx.translate(W - 190, H - 190); ctx.rotate(-14 * Math.PI / 180);
    ctx.strokeStyle = 'rgba(255,107,133,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 74, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,107,133,.85)'; ctx.font = '600 18px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('OFFICIAL', 0, -6); ctx.fillText('RECRUITMENT', 0, 18); ctx.restore();
    ctx.fillStyle = '#857d8c'; ctx.font = '500 20px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
    ctx.fillText(A.squad.archive.id + ' · ARCHIVE RECORD', 80, H - 70);
    cb(cv);
  };
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('74px Anton'), document.fonts.load('600 22px Inter')]).then(draw).catch(draw);
  } else draw();
}

let spy, revIO, cntIO, currentNav = 'overview';
function setActive(id){

function animateCount(el){
  const to = +el.dataset.count; if (reduced || to === 0) { el.textContent = pad(to); return; }
  const t0 = performance.now(), dur = 800;
  const step = (t) => { const p = Math.min(1, (t - t0) / dur); el.textContent = pad(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
  el.textContent = '00'; requestAnimationFrame(step);
}
function observe(){
  [spy, revIO, cntIO].forEach((o) => o && o.disconnect());
  if (!('IntersectionObserver' in window)) { $$('.reveal').forEach((e) => e.classList.add('in')); return; }
  spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setActive(NAVMAP[e.target.dataset.sec] || 'overview'); }), { rootMargin: '-40% 0px -55% 0px' });
  $$('[data-sec]').forEach((s) => spy.observe(s));
  revIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); revIO.unobserve(e.target); } }), { threshold: .12 });
  $$('.reveal').forEach((r) => revIO.observe(r));
  cntIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { animateCount(e.target); cntIO.unobserve(e.target); } }), { threshold: .6 });
  $$('.num[data-count]').forEach((n) => cntIO.observe(n));
}

function hl(text, tokens){
  const low = text.toLowerCase(), r = [];
  tokens.forEach((t) => { if (!t) return; let i = 0; while ((i = low.indexOf(t, i)) > -1) { r.push([i, i + t.length]); i += t.length; } });
  if (!r.length) return esc(text);
  r.sort((a, b) => a[0] - b[0]);
  const m = [r[0]]; r.slice(1).forEach((x) => { const l = m[m.length - 1]; if (x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push(x); });
  let out = '', p = 0; m.forEach((x) => { out += esc(text.slice(p, x[0])) + '<mark>' + esc(text.slice(x[0], x[1])) + '</mark>'; p = x[1]; });
  return out + esc(text.slice(p));
}

function runSearch(){

  const tokens = q.split(/\s+/).filter(Boolean), yearOnly = /^\d{4}$/.test(q), out = [];

    if (yearOnly) { if (it.yr && it.yr.includes(q)) out.push({ it, score: 1 }); return; }
    if (!tokens.every((t) => it.hay.includes(t))) return;

  else if (f.id === 'fStatus') { const st = {}; $$('select[data-key]', f).forEach((s) => { const d = squadData.status.find((x) => x.key === s.dataset.key); if (d && d.state !== s.value) st[s.dataset.key] = s.value; }); add.status = st; persist('Status arsip disimpan.'); }
});
$('#eBody').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.matches('[data-export]')) { download('ws-archive-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ format: 'ws-archive', version: 1, archiveId: squadData.archive.id, exportedAt: new Date().toISOString(), additions: add }, null, 2)); msg('Archive diekspor sebagai JSON.'); }
  else if (b.matches('[data-import]')) $('#importFile').click();
  else if (b.matches('[data-reset]')) { if (confirm('Reset Archive? Semua catatan tambahan akan dihapus dan arsip kembali ke data awal.')) { add = emptyAdd(); try { localStorage.removeItem(KEY); } catch (er) {} refresh(true); msg('Arsip dikembalikan ke data awal.'); toast('Arsip direset ke data awal.'); } }
  else if (b.dataset.rm) { const [k, id] = b.dataset.rm.split('|'); const key = k === 'eras' ? 'uid' : 'id'; add[k] = add[k].filter((x) => x[key] !== id); persist('Catatan dihapus.'); }
});
$('#eBody').addEventListener('change', (e) => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const file = e.target.files[0], rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j || typeof j !== 'object' || (j.format && j.format !== 'ws-archive')) throw new Error('format');
      const clean = sanitizeAdd(j.additions || j);
      const n = clean.players.length + clean.events.length + clean.eras.length + clean.leadership.length + Object.keys(clean.status).length;
      if (!confirm('Import ' + n + ' catatan tambahan? Catatan tambahan yang ada sekarang akan diganti. Data resmi bawaan tidak berubah.')) return;
      add = clean; persist('Import berhasil: ' + n + ' catatan tambahan.');
    } catch (er) { msg('Import gagal: file bukan arsip JSON yang valid.'); }
  };
  rd.readAsText(file); e.target.value = '';
});

/* =========================================================
   11. INIT + PWA
   ========================================================= */
if (window.location.hash === '#register') state.join = 'form';
A = build(); state.sel = A.players[0].key; state.mapEra = A.eras[A.eras.length - 1].uid;
renderAll(); buildIndex();
if (window.location.hash === '#register') { const el = document.getElementById('join'); if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' }); }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
})();
</script>
